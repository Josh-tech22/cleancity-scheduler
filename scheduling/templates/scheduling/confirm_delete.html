{% extends "scheduling/base.html" %}
{% block title %}Delete {{ type }}{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}
{% block content %}
<div style="max-width:500px">
  <div class="card" style="border-color:rgba(255,69,69,0.3)">
    <div style="font-size:2rem;margin-bottom:12px">⚠️</div>
    <h3 style="font-family:'Syne',sans-serif;margin-bottom:8px">Delete {{ type }}?</h3>
    <p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:20px">
      You are about to delete <strong style="color:var(--text)">{{ object }}</strong>. This action cannot be undone.
    </p>
    <form method="post" style="display:flex;gap:10px">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, Delete</button>
      <a href="{% url 'schedule_list' %}" class="btn btn-ghost">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
